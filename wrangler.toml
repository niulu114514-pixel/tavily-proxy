name = "tavily-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# For production, set AUTH_KEY as a secret:
#   npx wrangler secret put AUTH_KEY
# For local dev, set it in .dev.vars (see below)

# ---- D1 (key pool storage) ----
# The API key pool lives in Cloudflare D1 (SQLite) instead of KV.
# This avoids the KV free-plan operation quotas on the request hot path
# (the old KV version ran kv.list() on every pool pick).
# Create the database / apply the migration with:
#   npx wrangler d1 create tavily-proxy
#   npx wrangler d1 migrations apply tavily-proxy --remote
[[d1_databases]]
binding = "DB"
database_name = "tavily-proxy"
database_id = "9335b068-1f93-4a42-8666-98c6f009fd35"
migrations_dir = "migrations"

# Background /usage sync via cron. NOTE: cron triggers do NOT fire on the
# Workers Free plan. On Free, usage stays fresh through the lazy sync in
# GET /api/keys and the admin panel's "Sync usage now" (POST /api/keys/sync).
# On a paid plan, uncomment to sync keys every 30 minutes automatically.
[triggers]
crons = ["*/30 * * * *"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
